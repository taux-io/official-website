name: checks

# Every defect this repo has carried was something nobody re-checked: text that
# rendered white on white for an entire release, a stylesheet committed a build
# behind its templates, class names pointing at config keys that never existed.
# None of them were subtle. They simply had nothing watching for them.
#
# The contrast audit is the gate because its verdict is computed rather than
# eyeballed, and because the site currently passes it cleanly — so the rule is
# "must stay at zero" and needs no list of tolerated exceptions. Screenshots and
# the pixel diff are deliberately not gates: font rasterisation differs between
# machines and they would fail on noise. They are tools for a person deciding
# whether a change looks right.

on:
  pull_request:
  push:
    branches: [main]

# Read-only, written down rather than inherited. The repository default is
# already `read`, so this changes nothing today — which is the point: a default
# is a setting somebody else can move, and this job builds and executes code
# from pull requests.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain action and no version here. The runner ships rustup, which
      # reads rust-toolchain.toml on the first cargo invocation — so the channel
      # and components are declared in one file that CI, a laptop and the
      # deployment host all obey, rather than three places that agree until one
      # of them is edited.

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: generator

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: cargo fmt
        run: cargo fmt --manifest-path generator/Cargo.toml -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path generator/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path generator/Cargo.toml

      - name: build the site
        run: npm run build:site

      # styles.min.css is a build artifact under version control, generated from
      # the classes Tailwind finds in the templates. Editing a template after a
      # build leaves it silently short a rule — which has happened.
      - name: stylesheet is current
        run: npm run check:css

      # Tailwind emits nothing for a candidate it cannot resolve, so a class
      # naming a config key that does not exist looks deliberate, builds
      # cleanly, and silently has no effect. The redesign found 55 of them.
      - name: classes resolve
        run: npm run check:classes

      # llms.txt is written for models rather than people, so a page missing
      # from it is invisible to the audience the GEO work exists to reach. The
      # newest article shipped absent from it and nothing noticed.
      - name: llms.txt lists every page
        run: npm run check:llms

      # The build reads no git, so it cannot invent a date; this asserts every
      # page supplies one, that it parses, and that nothing claims to have been
      # revised in the future or published after it was revised.
      - name: dates are declared and coherent
        run: npm run check:dates

      # JSON.parse cannot report a duplicate key — it silently keeps the last
      # one, which is why the check that was supposed to catch seven of them
      # passed. This scans the text instead.
      - name: structured data is valid
        run: npm run check:jsonld

      # DESIGN.md is the single source of design truth, and its own argument is
      # that a rule nothing checks is not a rule — three previous generations of
      # design description drifted from the code unnoticed. This reads what the
      # author wrote rather than what Tailwind emitted, which is the check above.
      #
      # All twenty-four of its rules are enforced today. A rule is switched on by
      # the change that makes it true, so this stays green commit to commit
      # without an allowlist, and the script names the ticket that turned each
      # one on.
      #
      # (This comment said "six of nine" for long enough to outlive four more
      # rules — the drift the file underneath it exists to prevent. It then said
      # "fifteen" while the script printed 22 of 22, so the warning outlived
      # seven more. The number is printed on every run; this line is not where
      # to learn it.)
      - name: templates agree with DESIGN.md
        run: npm run check:design

      # main.rs promises that retiring a path without a redirect will be
      # caught. Nothing enforced that: every gate reads the current site.toml
      # and none of them remembers what used to be in it, so deleting a `path`
      # and forgetting the [[redirect]] passed everything while an indexed URL
      # started answering 404. published-paths.txt is the missing memory.
      - name: no path was retired silently
        run: npm run check:routes

      # The gates above ask whether structured data exists, parses, and avoids
      # the duplicate key JSON.parse resolves in silence. None of them asks
      # whether a reference points at anything: four templates named a WebSite
      # node no template defines, which is valid JSON-LD aimed at nothing, and
      # every gate passed it. This reads the assembled graph in dist/ rather
      # than the templates, because an @id graph only exists once the includes
      # have been composed.
      - name: entity declarations hold
        run: npm run check:entity

      # Two ledgers, one gate: word spacing across inline tags, and which
      # quotation mark each passage carries. Both are judgement calls no
      # pattern settles, so neither is a rule — the ledgers remember what a
      # person decided and this step only asks whether anything moved. It was
      # `check:ko-spacing` until the quotes ledger landed (issue #240); the
      # name lost the word "spacing" so it would not be half-true.
      - name: Korean spacing and quote decisions are unchanged
        run: npm run check:ko

      # 190 Chinese punctuation marks shipped on the English pages and passed
      # every gate above, because not one of them reads prose. Most of "does
      # this sentence read correctly" stays a person's job; the part that does
      # not is that `。` is never a full stop in English, and that part is here.
      #
      # The check itself existed for a while before this line did — in
      # scripts/i18n-extract.js, in no job, while DESIGN.md said it had been
      # added. A tool nothing runs is not a gate, which is this repo's own
      # argument about rules, applied to itself one file late.
      - name: English pages carry no CJK punctuation
        run: npm run check:i18n

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup on the runner reads rust-toolchain.toml — see the build job.

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: generator

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: install chromium
        run: npx playwright install --with-deps chromium

      - name: build the site
        run: npm run build:site

      # Served through the host emulator rather than a plain file server, so
      # _headers is applied. Without it the policy and cache assertions would
      # pass against headers nothing had sent — which is the failure this
      # project already had once, when the policy lived in a config file that
      # was not part of the running topology.
      - name: serve the built site
        run: |
          npm run serve &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8099/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8099/ || { echo "host emulator never came up"; exit 1; }

      # Exits non-zero on any element below its WCAG AA threshold. Anything
      # under 1.5:1 is reported separately as effectively invisible.
      - name: contrast audit
        run: npm run contrast

      # What each route declares to the machines that read it: status, document
      # language, canonical URL, share card, structured data, every referenced
      # asset, policy violations and script errors. Most of the defects found
      # during the redesign lived here rather than in anything a person looks at.
      - name: route contract
        run: npm run contract

      # Where things land, which neither of the two above can see. contrast
      # reads colour and contract reads what a route declares; a glyph coming
      # from the wrong face, a box whose lines disagree, or content clipped off
      # the right edge is invisible to both.
      #
      # Three of its four checks are enforced. The fourth — horizontal overflow
      # — is the only one that found anything, and what it found predates the
      # change that added this file; it is switched on by issue 151, and the run
      # prints its findings either way rather than staying quiet about them.
      #
      # Slower than its neighbours (~3 minutes) because the canvas walk has to
      # be driven one scroll position per round trip. Batching it into the page
      # made it fast and made it incapable of failing.
      - name: geometry holds
        run: npm run geometry

      # sameAs asserts "these are the same entity", so a dead profile URL is an
      # identity claim about nothing. Lives in this job rather than the one
      # above because it is the only entity rule that leaves the machine, and
      # the offline checks stay offline and fast.
      #
      # It catches a hard 404 and nothing subtler. A profile that no longer
      # exists behind a login wall answers 200, so deciding that a social
      # account is genuinely the company's remains a person's job.
      - name: sameAs targets exist
        run: npm run check:entity:links
