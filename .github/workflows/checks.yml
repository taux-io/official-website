name: checks

# Every defect this repo has carried was something nobody re-checked: text that
# rendered white on white for an entire release, a stylesheet committed a build
# behind its templates, class names pointing at config keys that never existed.
# None of them were subtle. They simply had nothing watching for them.
#
# The contrast audit is the gate because its verdict is computed rather than
# eyeballed, and because the site currently passes it cleanly — so the rule is
# "must stay at zero" and needs no list of tolerated exceptions. Screenshots and
# the pixel diff are deliberately not gates: font rasterisation differs between
# machines and they would fail on noise. They are tools for a person deciding
# whether a change looks right.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain action and no version here. The runner ships rustup, which
      # reads rust-toolchain.toml on the first cargo invocation — so the channel
      # and components are declared in one file that CI, a laptop and the
      # deployment host all obey, rather than three places that agree until one
      # of them is edited.

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: generator

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: cargo fmt
        run: cargo fmt --manifest-path generator/Cargo.toml -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path generator/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path generator/Cargo.toml

      - name: build the site
        run: npm run build:site

      # styles.min.css is a build artifact under version control, generated from
      # the classes Tailwind finds in the templates. Editing a template after a
      # build leaves it silently short a rule — which has happened.
      - name: stylesheet is current
        run: npm run check:css

      # Tailwind emits nothing for a candidate it cannot resolve, so a class
      # naming a config key that does not exist looks deliberate, builds
      # cleanly, and silently has no effect. The redesign found 55 of them.
      - name: classes resolve
        run: npm run check:classes

      # llms.txt is written for models rather than people, so a page missing
      # from it is invisible to the audience the GEO work exists to reach. The
      # newest article shipped absent from it and nothing noticed.
      - name: llms.txt lists every page
        run: npm run check:llms

      # The build reads no git, so it cannot invent a date; this asserts every
      # page supplies one, that it parses, and that nothing claims to have been
      # revised in the future or published after it was revised.
      - name: dates are declared and coherent
        run: npm run check:dates

      # JSON.parse cannot report a duplicate key — it silently keeps the last
      # one, which is why the check that was supposed to catch seven of them
      # passed. This scans the text instead.
      - name: structured data is valid
        run: npm run check:jsonld

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup on the runner reads rust-toolchain.toml — see the build job.

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: generator

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: install chromium
        run: npx playwright install --with-deps chromium

      - name: build the site
        run: npm run build:site

      # Served through the host emulator rather than a plain file server, so
      # _headers is applied. Without it the policy and cache assertions would
      # pass against headers nothing had sent — which is the failure this
      # project already had once, when the policy lived in a config file that
      # was not part of the running topology.
      - name: serve the built site
        run: |
          npm run serve &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8099/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8099/ || { echo "host emulator never came up"; exit 1; }

      # Exits non-zero on any element below its WCAG AA threshold. Anything
      # under 1.5:1 is reported separately as effectively invisible.
      - name: contrast audit
        run: npm run contrast

      # What each route declares to the machines that read it: status, document
      # language, canonical URL, share card, structured data, every referenced
      # asset, policy violations and script errors. Most of the defects found
      # during the redesign lived here rather than in anything a person looks at.
      - name: route contract
        run: npm run contract

  # Nothing reaches production without the route contract passing against the
  # version that is about to become production — not against a local emulator,
  # and not after the fact. `versions upload` publishes a version and returns a
  # preview URL without directing any traffic at it, so the assertions run on
  # the real edge while the current production version is still serving.
  #
  # The manual "verify after deploying" step this replaces could only ever
  # report that visitors were already being served something broken.
  deploy:
    needs: [build, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # A plain relative path, not ${{ runner.temp }}: the `runner` context does
      # not exist at job level, and referencing it there is not a step failure —
      # GitHub rejects the whole workflow file before any job is created, so the
      # run fails in zero seconds with no logs to read.
      WRANGLER_OUTPUT_FILE_DIRECTORY: .wrangler-output
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: generator

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: install chromium
        run: npx playwright install --with-deps chromium

      # Built here rather than carried from the build job, because what gets
      # uploaded has to be what this commit produces. An artifact handed between
      # jobs is one more place for the deployed bytes to stop matching the tree.
      - name: build the site
        run: npm run build:site

      # Read from wrangler's structured output rather than scraped from its
      # console output, which is formatted for a person and free to change.
      - name: upload a version
        id: upload
        run: |
          npx wrangler versions upload
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = process.env.WRANGLER_OUTPUT_FILE_DIRECTORY;
            const record = fs.readdirSync(dir)
              .flatMap((f) => fs.readFileSync(path.join(dir, f), "utf8").trim().split("\n"))
              .filter(Boolean)
              .map((line) => JSON.parse(line))
              .find((r) => r.type === "version-upload");
            if (!record) throw new Error("wrangler reported no version-upload record");
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `version_id=${record.version_id}\npreview_url=${record.preview_url}\n`
            );
            console.log(`${record.version_id} -> ${record.preview_url}`);
          '

      # A version is not servable the instant upload returns. Measured: the
      # first requests to a fresh preview URL came back 404 from the edge, with
      # Cloudflare's own error body rather than this site's — which is exactly
      # what the contract test is built to catch, so without this wait it would
      # catch it every time and block every deploy.
      - name: wait for the preview URL
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "${{ steps.upload.outputs.preview_url }}/" && exit 0
            sleep 2
          done
          echo "preview URL never became servable"
          exit 1

      # Canonical URLs are asserted against https://taux.io regardless of which
      # host is answering — see ORIGIN in scripts/routes.js — so running this
      # against a preview host tests the version rather than the hostname.
      #
      # HSTS and the www redirect are configured at the zone and cannot be seen
      # from here. The run prints what it did not assert.
      - name: route contract against the uploaded version
        run: BASE_URL=${{ steps.upload.outputs.preview_url }} npm run contract

      - name: promote the version to production
        run: npx wrangler versions deploy '${{ steps.upload.outputs.version_id }}@100' --yes
