name: checks

# Every defect this repo has carried was something nobody re-checked: text that
# rendered white on white for an entire release, a stylesheet committed a build
# behind its templates, class names pointing at config keys that never existed.
# None of them were subtle. They simply had nothing watching for them.
#
# The contrast audit is the gate because its verdict is computed rather than
# eyeballed, and because the site currently passes it cleanly — so the rule is
# "must stay at zero" and needs no list of tolerated exceptions. Screenshots and
# the pixel diff are deliberately not gates: font rasterisation differs between
# machines and they would fail on noise. They are tools for a person deciding
# whether a change looks right.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: generator

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: cargo fmt
        run: cargo fmt --manifest-path generator/Cargo.toml -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path generator/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path generator/Cargo.toml

      - name: build the site
        run: npm run build:site

      # styles.min.css is a build artifact under version control, generated from
      # the classes Tailwind finds in the templates. Editing a template after a
      # build leaves it silently short a rule — which has happened.
      - name: stylesheet is current
        run: npm run check:css

      # Tailwind emits nothing for a candidate it cannot resolve, so a class
      # naming a config key that does not exist looks deliberate, builds
      # cleanly, and silently has no effect. The redesign found 55 of them.
      - name: classes resolve
        run: npm run check:classes

      # llms.txt is written for models rather than people, so a page missing
      # from it is invisible to the audience the GEO work exists to reach. The
      # newest article shipped absent from it and nothing noticed.
      - name: llms.txt lists every page
        run: npm run check:llms

      # The build reads no git, so it cannot invent a date; this asserts every
      # page supplies one, that it parses, and that nothing claims to have been
      # revised in the future or published after it was revised.
      - name: dates are declared and coherent
        run: npm run check:dates

      # JSON.parse cannot report a duplicate key — it silently keeps the last
      # one, which is why the check that was supposed to catch seven of them
      # passed. This scans the text instead.
      - name: structured data is valid
        run: npm run check:jsonld

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: generator

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: install chromium
        run: npx playwright install --with-deps chromium

      - name: build the site
        run: npm run build:site

      # Served through the host emulator rather than a plain file server, so
      # _headers is applied. Without it the policy and cache assertions would
      # pass against headers nothing had sent — which is the failure this
      # project already had once, when the policy lived in a config file that
      # was not part of the running topology.
      - name: serve the built site
        run: |
          npx wrangler pages dev dist --port 8099 --ip 127.0.0.1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8099/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8099/ || { echo "host emulator never came up"; exit 1; }

      # Exits non-zero on any element below its WCAG AA threshold. Anything
      # under 1.5:1 is reported separately as effectively invisible.
      - name: contrast audit
        run: npm run contrast

      # What each route declares to the machines that read it: status, document
      # language, canonical URL, share card, structured data, every referenced
      # asset, policy violations and script errors. Most of the defects found
      # during the redesign lived here rather than in anything a person looks at.
      - name: route contract
        run: npm run contract
