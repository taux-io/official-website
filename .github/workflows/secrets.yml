name: secrets

# This repository is public: a credential that reaches a commit is published,
# and deleting the commit does not unpublish it. The pre-commit hook
# (.githooks/pre-commit) is the first net, and it is a habit: it runs only on a
# clone where somebody ran `npm run hooks:install`, and `git commit --no-verify`
# walks past it. This is the net that does not depend on anyone's habit — it
# reads the commits a pull request adds, on a machine nobody configured.
#
# It scans the PR's own commits (base..head), not the tree. A secret that was
# committed and then removed in a later commit of the same PR is still in the
# history that would be merged, and the tree check would call it clean.
#
# NOT THE gitleaks-action. For an organisation's repository it needs a paid
# license key held as a secret, and this job needs no secret at all. The binary
# is downloaded at a pinned version and checked against a pinned SHA-256, so a
# moved release tag cannot swap in different code on a runner that reads our
# source. Bump both together, deliberately.
#
# Whether this blocks a merge is a repository setting, not something this file
# decides: it blocks only once `gitleaks` is added to the required status checks
# (today: build, audit). Until then it reports and a person can still merge.

on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    # Pinned like checks.yml, for the same reason: the label moves, and a job
    # that fails because the image changed is a job people learn to ignore.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Full history: base..head needs both commits, and the base is not in a
      # shallow clone of the merge ref.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks

      # --redact: the log of a public repository's CI is public too, so a finding
      # must not print the secret it found. The rule, file, line and fingerprint
      # are enough to find it and, for a false positive, to add it to
      # .gitleaksignore. The built-in rules and .gitleaks.toml are read from the
      # repository root, exactly as the pre-commit hook reads them.
      - name: scan the commits this pull request adds
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          "${RUNNER_TEMP}/gitleaks" git --no-banner --redact --verbose \
            --log-opts="${BASE}..${HEAD}"
