[package]
name = "taux-generator"
version = "0.1.0"
edition = "2021"
description = "Renders the site to static HTML."

[dependencies]
htmd = "0.5.5"
# Jinja-family templating, so the existing Go templates convert mechanically
# rather than being rewritten: {{ .Title }} becomes {{ title }}, and a
# {{ template "header.html" . }} becomes {% include "header.html" %}. The HTML
# itself — 70 inline SVGs, two page-specific style blocks, fifteen distinct
# JSON-LD shapes — is the asset here, and none of it is touched.
minijinja = { version = "2", features = ["loader", "json"] }
serde = { version = "1", features = ["derive"] }
# The breadcrumb JSON-LD is built here rather than written in the templates:
# minijinja autoescapes `{{ … }}` in .html, so a URL interpolated into a JSON
# string renders as `https:&#x2f;&#x2f;…` — valid JSON, wrong data. Serialising
# in Rust and passing the result as a safe string cannot hit that.
# `preserve_order` keeps `@type` first, as every hand-written node has it.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

[[bin]]
name = "generate"
path = "src/main.rs"
