# The site's pages, and the only place they are declared.
#
# The Go build parsed this table out of handler source with a regex that
# depended on field order; a data file removes both the parsing and the
# fragility. The generator reads it to render, and the Node tooling reads it to
# audit and to build share cards, so neither language parses the other's source.
#
# Adding a page here is enough for the generator, the contract test, the
# contrast audit and the share-card builder to pick it up.
#
# WHAT A PAGE ROW LEAVES OUT. `canonical` defaults to
# https://taux.io/<locale><path> (the home route has no trailing path), and a
# locale's `template` defaults to the route's template for zh-Hant-TW and to
# <locale>/<template> for every other locale. All 100 canonicals and all 80
# locale templates were exactly that, so they are derived — by `Site::derive`
# in the generator and `derivedCanonical`/`derivedTemplate` in
# scripts/routes.js. Write either field only where a row genuinely differs.
#
# `crumb` is the page's name in its BreadcrumbList. The generator builds the
# whole node (home → page, from `nav_home` and the canonical) and serialises it
# in Rust; a template places it with `{{ breadcrumb }}` inside its @graph. It is
# the one breadcrumb field that cannot be derived — only 28 of 75 hand-written
# names matched the start of the title.

# THE LOCALE ROSTER.
#
# The roster is the DISPLAY ORDER and the per-locale settings. It is NOT the
# published set, and the difference is what lets English arrive one route at a
# time: hreflang and the switcher are built from each page's own locale table,
# so a route with no English entry advertises no English alternate and offers no
# English link. A roster entry with nothing behind it is inert, not a 404.
#
# ⚠️ This comment said the opposite until en-US arrived with no pages behind it.
# It claimed the roster was the published set — true while the two were the same
# list, and wrong the moment they were not.
#
# ALL FIVE LOCALES NOW HAVE ALL TWENTY ROUTES, so the roster and the published
# set happen to be the same list again — which is exactly the state that made
# the comment above wrong the first time. It is right for the moment and will
# stop being right the day a sixth locale is added, or a route lands in four
# languages instead of five. Read the paragraph above, not this line.
#
# `og` is Open Graph's own locale format — underscore, not hyphen. It is a
# separate field rather than a transform because og:locale takes a limited set
# of language_TERRITORY values and deriving it by replacing the hyphen would
# quietly emit `zh_Hant_TW`, which is not one of them.
[[locale]]
tag    = "zh-Hant-TW"
name   = "繁體中文"
og     = "zh_TW"
# The writing system, and it is a field rather than something guessed from the
# tag. FIVE things read it, and this list said "three" while two of them were
# already reading it:
#   1. `heading structure` — whether this locale needs a Chinese sub-line under
#      the Latin lead (decision #56)
#   2. `check:entity` — what script the title has to contain
#   3. geometry's `measure` probe — how many characters fit on a line before
#      reading gets hard (DESIGN.md's table)
#   4. `scripts/assets/build-og.js` — which font stack the 100 share cards draw
#      with (decision #62; before it read this, a Japanese card printed Chinese
#      glyphs by construction rather than by the build machine's luck)
#   5. `scripts/routes.js` — it owns the table the other four ask, so a locale
#      with an unknown script is a hard finding rather than a silent default
# Deriving it from "zh-*" would work until ja-JP, whose kanji are Han and whose
# kana are not.
script = "Hant"

  # Strings that live in shared templates.
  #
  # The header, the footer and the nav are ONE file rendered once per language,
  # so any prose in them cannot be translated by writing a second file the way a
  # page can. The alternative to this table is `{% if locale == "en-US" %}`
  # inline, which is where a template starts growing a branch per language.
  #
  # ⚠️ This comment said "there is exactly one such string today" and argued
  # that a table for one string looks like overkill. There are two now
  # (issue #241), and the second one arrived in a shared partial that nobody
  # had thought of as prose — `_identity.html`, which every page includes.
  #
  # The company's legal name and address are NOT here. They are identity, not
  # prose: check:entity asserts the Organization name matches 拓思, and a
  # translated legal name would be a different company. `org_description` is
  # the other half of that line — it is prose ABOUT the entity, not the entity,
  # so it reads in the language of the page that carries it. The registered
  # name inside it stays in Chinese wherever that locale's own footer already
  # keeps it (zh, ja, ko) and gives way to the English form where the footer
  # already does (en-US); the choice per locale is not re-litigated here.
  #
  # ⚠️ These strings land inside JSON in `_identity.html`, and minijinja
  # escapes them. An apostrophe or an ampersand would be emitted as `&#x27;` /
  # `&amp;` INSIDE a JSON string value — valid JSON, wrong text, and no gate
  # reads prose. Keep them free of characters HTML escaping touches.
  [locale.strings]
  copyright = "拓思科技股份有限公司 版權所有"
  # The nav's own label for the overlay. It was the literal `Explore` in
