# Generated as documents rather than declared as visitable routes. Cloudflare
# answers any unmatched path with 404.html at a 404 status — the Go server had
# to route /404.html explicitly, a static host does not — and a static site has
# no 500 to serve, since there is no application left to fail.
[[document]]
template = "404.html"
output   = "404.html"
# No canonical and noindex, because a static host answers 200 at /404 and this
# document is also the body for every unmatched path. Left as it was, the page
# told every crawler "index https://taux.io/404 as a page", and the one robots
# rule that existed disallowed /404.html — a path that only redirects. See #125.
title    = "找不到這個頁面｜404 | TauX"
description = "您要找的頁面不存在，可能已經移動或刪除。"
canonical   = ""
noindex     = true

# Paths that used to be routes.
#
# Declared here rather than hand-written into _redirects for the same reason the
# sitemap is generated: a hand-maintained list of URLs drifts from the pages it
# describes, and this project has already paid for that once. The generator
# emits _redirects from this table and the contract test asserts every entry, so
# a retired path cannot quietly start answering 404.
#
# An entry here is permanent. The whole point is that a URL somebody already
# linked to keeps working.
#
# ⚠️ POINTED AT THE FINAL DESTINATION, NOT AT THE NEXT HOP. Decision #58 moved
# /google-workspace-with-ai behind a locale prefix, and leaving this entry as it
# was would have made it a chain: /workspace-ai-roi -> /google-workspace-with-ai
# -> /zh-Hant-TW/google-workspace-with-ai. Two hops on an indexed URL, and the
# middle one exists only in this file's history.
#
# **When a destination is retired, every redirect that names it has to move
# too.** Nothing checks for chains — the contract test asserts each entry's own
# status and Location, which a chain satisfies at every link.
[[redirect]]
from   = "/workspace-ai-roi"
to     = "/zh-Hant-TW/google-workspace-with-ai"
status = 301

# The share card the retired page advertised.
#
# Renaming the route moved this file too, and og:image is an absolute URL that
# every scraper cached before the rename. Redirecting the page without
# redirecting its card leaves the link working and the card broken — on exactly
# the content the redirect was added to preserve.
#
# A retired route takes its assets with it. Check every absolute URL the old
# page published, not just its own path.
# The card moved twice: once with the rename, and again when the slug gained a
# locale prefix. Same rule as above — the destination is where the file is now,
# not where it was between the two moves.
[[redirect]]
from   = "/static/og/workspace-ai-roi.png"
to     = "/static/og/zh-Hant-TW/google-workspace-with-ai.png"
status = 301

# THE TWENTY PATHS THAT USED TO BE THE SITE.
#
# Every one of them is indexed. Decision #58 moves each behind a locale
# prefix and leaves a **stable** 301 here — stable meaning the destination
# does not vary by Accept-Language. A 301 is permanent and cacheable, so a
# language-dependent one would have browsers remember the wrong target and
# keep going there after the reader switches. The language sniff lives on
# `/` alone, as a 302, and nowhere else.
#
# Generated from the canonical list rather than typed, because twenty
# hand-written pairs is twenty chances to transpose one.

[[redirect]]
from = "/"
to   = "/zh-Hant-TW"

