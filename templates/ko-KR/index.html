<!-- WebPage. The Organization used to be declared here too, with the
     address and phone the about page's copy lacked and without the @id the
     about page's copy had — two companies as far as a consumer was concerned.
     It now lives in the header and is referenced. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebPage",
      "@id": "https://taux.io/ko-KR#webpage",
      "name": "拓思科技股份有限公司｜TauX - AI that earns its place｜GEO 생성형 엔진 최적화",
      "description": "TauX는 AI를 한 번 보여 주는 데모가 아니라 기업이 실제로 굴릴 수 있는 시스템으로 바꿉니다. GEO 생성형 엔진 최적화와 기술 개발을 합니다.",
      "url": "https://taux.io/ko-KR",
      "isPartOf": {"@id": "https://taux.io/#website"},
      "about": {"@id": "https://taux.io/#organization"}
    }
  ]
}
</script>

<!-- Hero. Single column over a full-bleed tau curve: the two-column
     copy-plus-illustration layout is SaaS landing-page grammar, and the
     mock product shell that used to sit on the right was fabricated
     evidence for a product that does not exist. -->
<section id="about-us" class="band relative overflow-hidden">

    <div class="max-w-6xl mx-auto px-6 relative z-10 w-full py-12 tablet:py-36">

        <h1 class="mb-6 tablet:mb-10 max-w-3xl">
            <!-- The break is written rather than left to the container. D-DIN
                 Condensed carries the Latin and the CJK faces fall through, so
                 the measured width of this line differs by machine; an
                 unforced break lands in a different place on each. Breaking
                 before "with AI" also puts the only content word in the
                 sentence on a line of its own. -->
            <span class="display-lead">AI that earns<br>its place</span>
            <span class="display-sub">AI를 회사가 진짜 쓸 수 있는 힘으로</span>
        </h1>

        <div class="max-w-[42ch]" itemscope itemtype="https://schema.org/Organization">

            <p class="text-lg leading-relaxed mb-5 max-w-prose">
                <strong itemprop="name" class="font-semibold">TauX</strong>는 AI를 한 번 보여 주는 데모가 아니라, 실제로 업무가 돌아가는 시스템으로 바꿉니다.
            </p>

            <p class="text-sm leading-relaxed max-w-prose" itemprop="description">
                회사 이름은 그리스 문자 <span class="font-sans">&tau;</span>에서 왔습니다. Tau는 물리학과 제어공학에서 말하는 <strong class="font-normal">시정수</strong> — 바깥의 변화에 얼마나 빨리 반응하고 얼마나 차분하게 새 안정으로 들어가는가입니다. TauX가 다루는 것은 기업이 AI를 마주할 때의 시정수입니다.
            </p>
        </div>

        <div class="mt-8 tablet:mt-12 flex flex-col mobile:flex-row gap-4">
            <!-- Opens the overlay rather than jumping down the page. This was
                 a fragment link into the services section, and that section is
                 gone: a fragment pointing at an id the page no longer has
                 scrolls nowhere and says nothing about having failed. The
                 overlay is where those links live now, and it names the overlay
                 in `aria-controls`, which is also how script.js finds every
                 trigger. (The rule that would have caught the stale form is
                 check-design's `anchor integrity` — it reads this file, so the
                 old href cannot be quoted here either.) -->
            <button type="button" class="btn" aria-expanded="false" aria-controls="menuOverlay">서비스 보기</button>
        </div>
    </div>
</section>
