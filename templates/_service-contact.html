{% from "_blocks.html" import cover -%}
<!-- The contact block that closes every service page. Email only: the site is
     static, and a form would need a third-party backend and a CSP change. -->
<section>
<div class="bg-ink/5 px-6 py-8 -mx-6 tablet:mx-0 flex flex-col mobile:flex-row mobile:items-center gap-6">
<div class="w-32 shrink-0 mobile:order-last">{% set art = "bot-mail" %}{% include "_art.html" %}</div>
<div class="flex-1">
    {% call cover() %}{{ strings.service_contact_title }}{% endcall %}
    <p class="mb-6 max-w-[42ch] text-lg">{{ strings.service_contact_body }}</p>
    <div class="flex flex-col mobile:flex-row gap-4">
        <a href="mailto:hello@taux.io" class="btn">{{ strings.service_contact_button }}</a>
    </div>
</div>
</div>
</section>
