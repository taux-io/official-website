<!-- The slide deck's stylesheet, included by all five locales of
     /claude-skills-guide. It was an 819-line style block pasted into each
     locale's template — byte-identical, ~4,100 lines of CSS to keep in step by
     hand. The rendered pages are unchanged: the block is still inlined where it
     was, it is just written once. --><style>
    * {
        box-sizing: border-box;
    }

    .skills-guide-body {
        background-color:var(--surface);
        display: grid;
        gap: 30px;
        grid-template-columns: 1fr;
        margin: 0;
        min-height: 100vh;
        padding: 30px 15px;
        place-items: center;
        /* The site stack, and the CJK tail is the --cjk token so this file follows
           the page's language like everything else (decision #55).

           IT USED TO NAME D-DIN. That face was self-hosted and went with
           decision #53; static/fonts/ has not existed since. Four declarations
           here kept asking for it and quietly resolved to PingFang TC — on a
           page nobody looked at in Windows, and with no gate that can see
           inside a <style> block. check:classes reads utility classes; it
           cannot read this. Copying it into the English twin would have made
           two of them — and it was copied into all four twins, so there
           were five, until it moved into this partial. */
        font-family: "SF Pro Text", system-ui, -apple-system, var(--cjk), sans-serif;
        overflow-x: hidden;
    }

    .skills-guide-body .slide-container {
        align-items: center;
        background-color:var(--surface);
        border-radius: var(--radius);
        border:1px solid var(--line);
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 1280px;
        height: auto;
        min-height: 720px;
        justify-content: center;
        overflow: hidden;
        padding: 60px;
        position: relative;
        color:var(--ink);
    }

    /* The title slide is a band, and a band is one screen.
       `.skills-guide-body .slide-container` is specificity 0,2,0 and .band is
       0,1,0, so adding the class to #slide1 lost silently: the route kept
       opening with a 720px title slide while check:design and the cover probe
       both passed — the probe only measures [data-cover] bands and a hero is
       not one. Written here rather than by raising .band, because the deck's
       own floor is correct for every other slide. */
    .skills-guide-body .slide-container.band {
        /* One screen means one screen ON THIS PAGE, not one viewport measured
           from nowhere. The deck sits inside .skills-guide-body, which pads 30px
           at the top, and the site nav is `fixed` so it takes no flow space
           while covering the first 64px. A plain 100vh here put the slide's
           bottom border about 94px past the fold — a hero with a scrollbar,
           which is the defect this override was added to close.

           94 = 30 (container padding) + 64 (nav). Both are subtracted. */
        min-height: calc(100vh - 94px);
        min-height: calc(100svh - 94px);
    }

    .skills-guide-body .slide-container.dark-theme {
        background-color:var(--surface);
        color:var(--ink);
    }

    .skills-guide-body .slide-container::before {
        content: '';
        position: absolute;
        top: 0;
        inset-inline-start: 0;
        width: 100%;
        height: 2px;
        background:var(--line);
        z-index: 0;
    }

    .skills-guide-body .slide-container.dark-theme::after {
        content: '';
        position: absolute;
        bottom: -50%;
        inset-inline-end: -20%;
        width: 800px;
        height: 800px;
        border-radius: var(--radius);
        background: none;
        z-index: 0;
        pointer-events: none;
    }

    .skills-guide-body .slide-container>* {
        position: relative;
        z-index: 1;
    }

    .skills-guide-body h2,
    .skills-guide-body h3,
    .skills-guide-body th {
        font-family: "SF Pro Display", system-ui, -apple-system, var(--cjk), sans-serif;
        font-weight: 700;
        /* This page carries its own light palette in this block, so it has to
           state a heading colour rather than inherit the site default, which
           is now white. Tokenised along with the rest of the block. */
        color:var(--ink);
        margin: 0;
    }

    .skills-guide-body h1 {
        font-size: 72px;
        /* 0.02em, not -1px. Negative tracking is the previous reference

        letter-spacing: 0.02em;
        line-height: 1.2;
        margin-bottom: 20px;

    }

        width: 100%;
        min-height: 400px;
        word-wrap: break-word;
