<!-- The many-shot jailbreaking chart on what-is-prompt-injection, drawn at build
    time. It was a canvas element fed by Chart.js from jsDelivr: ~70 KB gzip of
    third-party script loaded synchronously mid-<main>, one more origin in the
    CSP, and a script shared by all five locales with its legend and axis titles
    hard-coded in Traditional Chinese — so four of the five pages showed a chart
    in the wrong language, and a screen reader or a crawler got nothing at all.

    Now: an SVG whose text is the page's own, and the same numbers as a
    visually hidden table, which is also what the Markdown twin carries (the
    twin skips svg elements). The data is illustrative, as the source line says; it is
    written once here so five locales cannot disagree about it.

    The caller supplies the words through a with-block: label_large,
    label_small, axis_x, axis_y. -->
{%- set large = [5, 15, 30, 50, 70, 85, 92, 95, 98, 99, 100] -%}
{%- set small = [2, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50] -%}
<figure class="mt-2">
    <ul class="flex flex-wrap gap-x-6 gap-y-1 mb-4 text-sm">
        <li class="flex items-center gap-2">
            <svg class="w-6 h-2 text-ink" aria-hidden="true" focusable="false"><line x1="0" x2="24" y1="4" y2="4" stroke="currentColor" stroke-width="2"/></svg>
            {{ label_large }}
        </li>
        <li class="flex items-center gap-2">
            <svg class="w-6 h-2 text-ink" aria-hidden="true" focusable="false"><line x1="0" x2="24" y1="4" y2="4" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/></svg>
            {{ label_small }}
        </li>
    </ul>
    <div class="ps-9 pe-3 pt-6 pb-12">
        <svg class="block w-full h-64 overflow-visible text-ink-soft" aria-hidden="true" focusable="false">
            <text x="-36" y="0" dy="-1.4em" class="text-xs" fill="currentColor">{{ axis_y }}</text>
            {%- for v in [0, 25, 50, 75, 100] %}
            <line x1="0" x2="100%" y1="{{ 100 - v }}%" y2="{{ 100 - v }}%" class="text-line" stroke="currentColor" stroke-width="1"/>
            <text x="-8" y="{{ 100 - v }}%" dy="0.32em" text-anchor="end" class="text-xs" fill="currentColor">{{ v }}</text>
            {%- endfor %}
            {%- for x in [0, 20, 40, 60, 80, 100] %}
            <text x="{{ x }}%" y="100%" dy="1.5em" text-anchor="middle" class="text-xs" fill="currentColor">{{ x }}</text>
            {%- endfor %}
            <text x="50%" y="100%" dy="3.2em" text-anchor="middle" class="text-xs" fill="currentColor">{{ axis_x }}</text>
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" class="overflow-visible text-ink">
                <polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="{% for y in large %}{{ loop.index0 * 10 }},{{ 100 - y }} {% endfor %}"/>
                <polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 4" vector-effect="non-scaling-stroke" points="{% for y in small %}{{ loop.index0 * 10 }},{{ 100 - y }} {% endfor %}"/>
            </svg>
        </svg>
    </div>
    <!-- The wrapper, not the table, carries sr-only. A table ignores the 1px
         width sr-only sets and lays out at its content width, so on a phone
         the invisible table pushed the page 170–410px past the viewport. A
         block that clips it does not. -->
    <div class="sr-only">
    <table>
        <thead>
            <tr><th scope="col">{{ axis_x }}</th><th scope="col">{{ label_large }}</th><th scope="col">{{ label_small }}</th></tr>
        </thead>
        <tbody>
            {%- for y in large %}
            <tr><td>{{ loop.index0 * 10 }}</td><td>{{ y }}</td><td>{{ small[loop.index0] }}</td></tr>
            {%- endfor %}
        </tbody>
    </table>
    </div>
</figure>
