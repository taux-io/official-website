<!-- The menu's service columns, generated from site.toml.

     Each page declares a `section`; the generator groups them per locale
     (`Site::nav_for`) and passes `nav` — so a service not yet translated into
     a language is not linked from that language's menu, and a new page needs
     no edit here. Technical articles are no longer menu items: they are
     listed on /insights, linked from the Company column.

     Earlier history: the four topic nav columns. ONE CALLER NOW: the header overlay.

     They used to render in the footer as well, and the two copies had drifted —
     the footer's Company column had lost Home and GitHub, so the two halves of
     the same site disagreed about what the site contains and nothing noticed.
     The footer's copy is gone entirely: the menu is the only navigation, so
     there is no second taxonomy left to drift from this one.

     Only the four topic columns live here; the Company column is written inline
     in header.html beside the include. That split predates the removal and is
     worth leaving alone — the four below are identical by construction, and a
     fifth column with a different link set inside the same file would end that.

     The caller still supplies link_class and list_space through a with-block.
     A single caller does not make the seam pointless: it is what let the footer
     be deleted without touching a single link.

     Note for whoever edits this comment: minijinja parses its tags inside HTML
     comments too, so writing a literal with-tag here opens a block that is
     never closed and the build fails with a bare 'could not render include'. 
     SERVICES ONLY, GROUPED BY WHAT A CLIENT BUYS (2026-09, owner's decision).
     The columns used to be subjects — GEO, AI, Security, Open source — each
     mixing one service page with the guides about that subject, on the
     argument that "a visitor arrives with a problem, not with a preference
     about content types". That held while the site was mostly guides. Once
     it offers services by name, the menu is where a client looks for what can
     be bought, and fifteen articles in it buried four services; the articles
     moved to /insights, and every service page links the guides that back it.
-->
{%- for col in nav %}
        <div>
            <h2 class="eyebrow mb-8">0{{ loop.index }} — {{ col.title }}</h2>
            <ul class="{{ list_space }}">
            {%- for item in col.items %}
        <li><a href="{{ item.href|safe }}" class="{{ link_class }}">{{ item.label }}</a></li>
            {%- endfor %}
            </ul>
        </div>
{%- endfor %}
