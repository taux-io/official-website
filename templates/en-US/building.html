{% include "header.html" %}

<!-- Schema.org JSON-LD: WebPage -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "Building in Public",
  "description": "Follow our journey as we build TauX. Transparency, updates, and behind-the-scenes.",
  "url": "https://taux.io/en-US/building",
  "publisher": {% include "_org-ref.html" %}
}
</script>

<div class="max-w-prose mx-auto px-6 pt-2 pb-10">
<section class="band">
        <!-- Icon -->
        <div class="mb-6">
            <svg aria-hidden="true" focusable="false" class="w-16 h-16" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                </path>
            </svg>
        </div>

        <!-- Title.

             ONE LINE, NOT TWO, and that is the rule rather than an omission.
             Decision #6 gave the h1 a Latin lead over a Chinese sub because
             Chinese has no upper case, so the display signature could only be
             carried by the Latin line. On an English page the lead IS the
             content, and a sub-line under it would have nothing to say.
             `heading structure` asks for `display-sub` only from locales whose
             script is not Latin (decision #56). -->
        <h1 class="mb-6">
            <span class="display-lead text-display-sm tablet:text-display-md">Building in Public</span>
        </h1>

        <!-- Description -->
        <p class="text-lg mb-6 max-w-[42ch] leading-relaxed">
            We are currently crafting something extraordinary here. <br>
            This page is under construction and will be available soon.
        </p>

        <!-- CTA -->
        <a href="/{{ locale }}" class="btn">
            Back to Home
        </a>
</section>
</div>
