<!-- When the article was last revised (DESIGN.md decision 180), from the same
     `date_modified` the JSON-LD and the Markdown twin carry. A technical
     article's claims age; the reader has to be able to see how old they are. -->
<p class="text-sm text-ink-soft mb-4"><time datetime="{{ date_modified }}">{{ strings.article_updated }} {{ date_modified }}</time></p>
