<!DOCTYPE html>
<html lang="zh-Hant-TW" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    {% if canonical %}
    <link rel="canonical" href="{{ canonical }}">{% endif %}{% if noindex %}
    <meta name="robots" content="noindex, follow">{% endif %}

    <!-- Open Graph. The share card is built from the same tokens, typeface and
         tau curve as the page; rerun scripts/assets/build-og.js after a
         palette change and every image follows. -->
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:type" content="website">
    {% if canonical %}<meta property="og:url" content="{{ canonical }}">{% endif %}
    <meta property="og:site_name" content="TauX 拓思科技">
    <meta property="og:locale" content="zh_TW">
    <meta property="og:image" content="{{ og_image }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ title }}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ description }}">
    <meta name="twitter:image" content="{{ og_image }}">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">

    <!-- Fonts: D-DIN and Roboto Mono, self-hosted, Latin only. CJK renders from
         the system faces, so no Chinese webfont is downloaded and no reflow
         waits on one. The three regular weights are preloaded because they set
         the first paint; the bold faces load on demand. Roboto Mono is in that
         set because the dates and section numbers it sets are above the fold on
         the guides. -->
    <link rel="preload" href="/static/fonts/D-DIN.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/D-DINCondensed.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/RobotoMono.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Identity. One organisation and one website, declared here so they land
         on every page, and referenced by @id from every page's own block.

         Consumers merge all the JSON-LD in a document into one graph, so a
         reference in a page's block resolves against this one. Declaring it
         here rather than repeating it per page is what makes "one company, one
         @id" true by construction instead of by fifteen people remembering.

         It used to be restated instead. Four shapes of the same company
         existed: the home page carried the address and phone but no @id and no
         logo, the about page carried the logo and an @id but no address, and
         the author and publisher of seven articles carried a name and a URL and
         nothing else. A node without an @id is its own entity to a consumer, so
         that was four companies, each holding a different subset of the facts,
         and none of them the one the articles named as their publisher.

         The WebSite node is not decoration: four templates already referenced
         https://taux.io/#website through isPartOf, and until now nothing on the
         site declared it. Those were four pointers at nothing.

         _identity.html holds JSON and nothing else — no comment, not even an
         explanatory one. The generator strips HTML comments but deliberately
         steps over <script> bodies, so a comment inside that partial is emitted
         verbatim into the JSON and breaks every page on the site. Which is
         exactly what the first version of this did.

         The anchoring fields in it are the ones checkable against the public
         company register rather than taken on trust: 統一編號 60794471,
         incorporated 2025-03-26, registered at 高雄市岡山區文賢路57號2樓 with
         高雄市政府經濟發展局. The address parts concatenate back to the
         registered string exactly — region + locality + street — which is why
         they are split that way rather than prettified. -->
    <script type="application/ld+json">
    {"@context": "https://schema.org","@graph": [
      {% include "_identity.html" %},
      {
        "@type": "WebSite",
        "@id": "https://taux.io/#website",
        "url": "https://taux.io",
        "name": "TauX 拓思科技",
        "alternateName": "拓思科技股份有限公司",
        "inLanguage": "zh-Hant-TW",
        "publisher": {% include "_org-ref.html" %}
      }
      ]
    }
    </script>

    <!-- Styles. The query is a hash of the stylesheet's own bytes, computed by
         the generator — see css_version() in generator/src/main.rs. It was a
         hand-incremented literal until PR 145 and had not moved since the
         Go-to-Rust migration, through every palette and type change in
         between. A number that has to be remembered is a number that will be
         forgotten; this one cannot lag the file it busts.

         Ticket numbers in template comments are written "PR 145" or
         "issue 133", never with a leading hash. Three hex digits after a
         hash IS a valid
         colour, so the zero-hex rule flags it — correctly, since it cannot
         know a three-digit number is a ticket rather than a dark blue. The
         convention bends here rather than the checker: widening the rule to
         let decimal-looking values through would blind it to real colours
         written the same way. Both drafts of this very comment tripped it. -->
    <link rel="stylesheet" href="/static/css/styles.min.css?v={{ css_version }}">
</head>

<body class="bg-surface text-ink font-sans antialiased">

    <!-- Navigation.

         Five of the seven previous items were guide articles, which made this
         a table of contents rather than a navigation — and set uppercase and
         tracked they overran the container besides. The guides now live behind
         one item that opens the full-screen menu, the way a mega menu works;
         every link stays one interaction away and, since the overlay markup is
         always in the document, still visible to crawlers. -->
    <!-- site-nav carries the material: the shadow and the scroll edge that
         replaced the 1px rule under it (issue 156). A hairline says "here is a
         boundary"; a floating layer with content passing beneath it says
         "there is more up there", which is the true statement. -->
    <nav class="site-nav fixed w-full z-50 bg-surface/90 backdrop-blur-md transition-transform duration-300"
        aria-label="Main Navigation">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <!-- h-full rather than the text's own 33px: the bar is 64px tall
                 and the wordmark is a control, so its target should fill the
                 bar rather than stop at the cap height. -->
            <a href="/" class="wordmark"
                aria-label="TauX Homepage">
                TauX
            </a>

            <!-- Two items, and they are the two axes: Explore opens what the
                 site contains, Start Building is what to do about it. GEO and
                 Data Governance used to sit alongside them and were a
                 different kind of thing — single service pages, one level
                 down. Both are one click away in the overlay (columns 01 and
                 03), whose markup is always in the document.

                 THE BREAKPOINT HERE AND THE HAMBURGER'S BELOW ARE ONE
                 DECISION. Let them drift and both navigations render together
                 in the gap between them — a defect visible only at particular
                 window widths, which is to say invisible during development.
                 check-design.js rule "nav breakpoints paired" holds them. -->
            <div class="hidden sm:flex items-center gap-10">
                <button type="button" id="menuTrigger" class="nav-link" aria-expanded="false"
                    aria-controls="menuOverlay">
                    Explore
                </button>
                <a href="https://github.com/taux-io" target="_blank" rel="noopener noreferrer" class="btn">
                    Start Building
                </a>
            </div>

            <!-- 44x44. It measured 40x31 before issue 154 — the only way into
                 the site on a phone, and under the minimum target on both
                 axes. The bars keep their own size; the button grows around
                 them and centres them. -->
            <button type="button" id="hamburger"
                class="sm:hidden flex flex-col items-center justify-center gap-1.5 min-w-11 min-h-11 transition-opacity duration-200 z-50"
                aria-label="Open menu" aria-expanded="false" aria-controls="menuOverlay">
                <span class="w-6 h-px bg-ink transition-all duration-300 origin-center"></span>
                <span class="w-6 h-px bg-ink transition-all duration-300 opacity-100"></span>
                <span class="w-6 h-px bg-ink transition-all duration-300 origin-center"></span>
            </button>
        </div>
    </nav>

    <!-- Full-screen menu. One overlay serves both triggers: the hamburger on
         small screens and Guides on large ones.

         SHIPS INERT, AND THE SCRIPT LIFTS IT. opacity-0 and pointer-events-none
         hide it from eyes and mice and do nothing for a keyboard: the twenty
         links inside stayed in the tab order, so tabbing past Start Building
         walked into twenty stops on an invisible menu with no focus ring to
         see. inert is the one attribute that fixes that without touching what
         is in the document — the markup stays put for crawlers, which is the
         whole reason this overlay is rendered rather than fetched.

         Inert in the markup rather than applied by the script, so the failure
         mode points the right way: if the script never runs, the menu cannot
         open, and an unopenable menu should not be collecting focus. The
         script removes the attribute when it opens the overlay and puts it
         back when it closes. -->
    <div id="menuOverlay" inert
        class="menu-surface fixed inset-0 z-[60] opacity-0 pointer-events-none overflow-y-auto"
        role="dialog" aria-modal="true" aria-label="Site menu">
        <div class="max-w-6xl mx-auto px-6 py-6">
            <div class="flex items-center justify-between h-10">
                <span class="font-display text-lg uppercase tracking-[0.09em] text-ink">TauX</span>
                <button type="button" id="menuClose"
                    class="eyebrow text-ink hover:text-ink transition-colors duration-200"
                    aria-label="Close menu">
                    Close
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-12 md:gap-16 mt-16 md:mt-24 pb-16">
{% with link_class = "menu-link", list_space = "space-y-5" %}{% include "_nav-columns.html" %}{% endwith %}
                    <div>
                <!-- One destination, one label, and the label is what the page is.

                /building used to be the target of three links — API, Blog and
                Careers — and it is none of those. It is a placeholder that
                says "Building in Public". A visitor clicking Careers got a
                page with no jobs on it; a visitor clicking API got a page with
                no API. Those two are gone rather than repointed, because there
                is nothing to point them at: adding them back is a job for
                whoever builds the pages they promised. -->
                        <h2 class="eyebrow mb-8">05 — Company</h2>
                        <ul class="space-y-5">
                            <li><a href="/" class="menu-link">Home</a></li>
                            <li><a href="/about" class="menu-link">About</a></li>
                            <li><a href="/building" class="menu-link">Building in Public</a></li>
                            <li>
                            <a href="https://github.com/taux-io" target="_blank" rel="noopener noreferrer"
                            class="menu-link">GitHub</a>
                            </li>
                        </ul>
                    </div>

            </div>
        </div>
    </div>

    <!-- Main Content Wrapper. The nav is translucent, so a light surface here
         would show through it. -->
    <main class="pt-16 min-h-screen relative overflow-x-clip bg-surface">
