{% include "header.html" %}

<section class="relative min-h-screen flex items-center justify-center pt-16 overflow-hidden bg-surface">
    <div class="relative z-10 max-w-3xl mx-auto px-6 text-center">

        <!-- The one page set entirely in Departure Mono.
             It has no prose to carry, no responsive type scale to ride and no
             search value to lose, which is what makes it the right place for a
             face that only lands on whole pixels at multiples of 11px. Sizes
             below are therefore literal — 11px, 22px, 33px — and deliberately
             not part of the type scale. check:design's "pixel face scope" rule
             holds that boundary.

             No mascot and no joke. DESIGN.md's 語域 takes the reference site's
             form and the product layer's tone: the same pixel vocabulary, read
             as an instrument rather than as a game. -->
        <pre class="font-pixel text-[11px] md:text-[22px] leading-[1.2727] text-ink-body inline-block text-left mb-10" aria-hidden="true">┌────────────────────────┐
│ <span class="text-phosphor">ERR 404</span>   NOT FOUND    │
│                        │
│ ░░▒▒▓▓██████▓▓▒▒░░     │
└────────────────────────┘</pre>

        <h1 class="mb-6">
            <span class="display-lead">Page Not Found</span>
            <span class="display-sub">找不到這個頁面</span>
        </h1>

        <p class="text-lg text-ink-body mb-10 max-w-xl mx-auto leading-relaxed">
            您正在尋找的頁面不存在。它可能已被移除、重新命名或暫時無法使用。
        </p>

        <div class="flex justify-center gap-4">
            <a href="/" class="btn">
                回到首頁
            </a>
        </div>
    </div>
</section>
