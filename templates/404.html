{% include "header.html" %}

<section class="band relative pt-16 overflow-hidden bg-surface text-center">
    <div class="relative z-10 max-w-3xl mx-auto px-6 text-center">

        <!-- The pixel-set ASCII frame that stood here is gone with the
             monospace faces (DESIGN.md decision #53). It is not redrawn in
             another face: Departure Mono and the box-drawing subset differ by
             6% in advance, so any proportional face pulls every row out of
             line, and decision #41 records that you cannot tell that apart from
             a two-character miscount by eye.

             What replaces it is the standard band — the same shape every other
             route opens with. This page has no prose to carry and no search
             value to lose, which is exactly why it can be the plainest instance
             of the vocabulary rather than an exception to it. -->
        <p class="eyebrow mb-6">Error 404</p>

        <h1 class="mb-6">
            <span class="display-lead">Page Not Found</span>
            <span class="display-sub">找不到這個頁面</span>
        </h1>

        <p class="text-lg text-ink mb-10 max-w-xl mx-auto leading-relaxed">
            您正在尋找的頁面不存在。它可能已被移除、重新命名或暫時無法使用。
        </p>

        <div class="flex justify-center">
            <a href="/" class="btn">
                回到首頁
            </a>
        </div>
    </div>
</section>
